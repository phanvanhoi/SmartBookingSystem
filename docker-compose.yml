services:
  app:
    build: .
    container_name: musicbox-app
    restart: unless-stopped
    # Docker Desktop (Windows/Mac): bridge + publish ports.
    # (network_mode: host chỉ dùng được trên Linux VPS)
    ports:
      - "${APP_PORT:-8081}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Absolute path — Prisma resolves SQLite relative to schema location.
      - DATABASE_URL=file:/app/data/musicbox.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30d}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set (comma-separated origins)}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - FB_APP_SECRET=${FB_APP_SECRET:-}
      - FB_VERIFY_TOKEN=${FB_VERIFY_TOKEN:-}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - musicbox-data:/app/data
      - musicbox-uploads:/app/uploads
      - musicbox-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  musicbox-data:
  musicbox-uploads:
  musicbox-logs:
